<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="user-scalable=no,width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Solar System</title>
    <link rel="icon" href="img/solar-system.png">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="hud">


            <div class="hud__nav">
                <ul class="hud__list" id="nav-hud">
                    <li class="hud__list-item">
                        <a id="camera" class="hud__item-link">Solar System</a>
                    </li>
                    <li class="hud__list-item">
                        <a id="orbitElement" class="hud__item-link"><b>O</b>rbit</a>
                    </li>
                    <li class="hud__list-item">
                        <a id="minusElement" class="hud__item-link"><b>-</b></a>
                    </li>
                    <li class="hud__list-item">
                        <a id="plusElement" class="hud__item-link"><b>+</b></a>
                    </li>
                    <li class="hud__list-item">
                        <a id="zoomElement" class="hud__item-link"><b>Z</b>oom: 1</a>
                    </li>
                </ul>
            </div>

            <div class="hud__time">
                <ul class="hud__list" id="time-hud">
                    <li class="hud__list-item">
                        <a id="clockElement" class="hud__item-link"><b>C</b>lock</a>
                    </li>
                    <li class="hud__list-item">
                        <a id="stopElement" class="hud__item-link">Stop</a>
                    </li>
                    <li class="hud__list-item">
                        <a id="timeElement" class="hud__item-link"><b>U</b>nit</a>
                    </li>
                </ul>
            </div>

            <div class="hud__planets">
                <ul id="hud-planets" class="hud__list"></ul>
            </div>
            <div class="hud__moons">
                <ul id="hud-moons" class="hud__list"></ul>
            </div>
            <div class="hud__suns">
                <ul id="hud-suns" class="hud__list"></ul>
            </div>
            <div class="hud__other">
                <ul id="hud-other" class="hud__list"></ul>
            </div>
            <div class="hud__hide-toggle">
                <a id="hideElement" class="hud__list-item"><b>H</b>UD</a>
            </div>

        </div>
    </div>
    <div style="display:none;">
        <img id="img" src="img/voyager.png" alt="Voyager clip art">
        <img id="satellite" src="img/satellite.png" alt="Satellite clip art">
    </div>
    <script src="script/globals.js"></script>
    <script src="script/classes/CelestialBody.js"></script>
    <script src="script/classes/Sun.js"></script>
    <script src="script/classes/Planet.js"></script>
    <script src="script/classes/Moon.js"></script>
    <script src="script/classes/Asteroid.js"></script>
    <script src="script/classes/Star.js"></script>
    <script src="script/classes/Satellite.js"></script>
    <script src="script/classes/BlackHole.js"></script>
    <script src="script/classes/FlyingBody.js"></script>
    <script src="script/classes/Photon.js"></script>
    <script src="script/classes/Probe.js"></script>
    <script src="script/classes/Stars.js"></script>
    <script src="script/classes/Galaxy.js"></script>
    <script src="script/objects/factories.js"></script>
    <script src="script/objects/bodies.js"></script>
    <script src="script/test/test.js"></script>
    <script src="script/main.js"></script>
    <script src="script/ui/controls.js"></script>
    <script src="script/ui/touch.js"></script>
</body>

</html>
